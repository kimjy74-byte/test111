<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 현장 사진 전송 (GitHub Pages 중계)</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.3rem;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
        }

        .pin-group {
            text-align: left;
            margin-bottom: 1.25rem;
        }

        .pin-group label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #334155;
            display: block;
            margin-bottom: 0.4rem;
        }

        .pin-group input {
            width: 100%;
            padding: 0.8rem;
            font-size: 1.5rem;
            font-family: monospace;
            letter-spacing: 6px;
            text-align: center;
            border-radius: 10px;
            border: 2px solid #cbd5e1;
            background: #f1f5f9;
        }

        .pin-group input:focus {
            border-color: var(--primary);
            outline: none;
            background: #fff;
        }

        .camera-btn {
            width: 100%;
            background: #eff6ff;
            border: 2px dashed #93c5fd;
            border-radius: 12px;
            padding: 1.5rem 1rem;
            color: #1d4ed8;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .camera-btn:active {
            background: #dbeafe;
        }

        .camera-btn .icon {
            font-size: 2.2rem;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .preview-item {
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .submit-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1.05rem;
            font-weight: bold;
            margin-top: 1.25rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .status-msg {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            display: none;
        }

        .status-success {
            background: #f0fff4;
            border: 1px solid #86efac;
            color: #166534;
        }

        .status-error {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📸 현장 사진 전송 (GitHub Pages)</h1>
            <p>PC 화면에 표시된 6자리 핀코드를 입력하고 전송하세요.</p>
        </header>

        <form id="uploadForm">
            <div class="pin-group">
                <label for="pinInput">PC 화면 6자리 핀코드:</label>
                <input type="text" id="pinInput" placeholder="123456" maxlength="6" pattern="[0-9]*" inputmode="numeric" required>
            </div>

            <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">

            <button type="button" class="camera-btn" onclick="document.getElementById('fileInput').click()">
                <span class="icon">📷</span>
                <span>사진 촬영 / 갤러리 선택</span>
            </button>

            <div class="preview-grid" id="previewGrid"></div>

            <button type="submit" class="submit-btn" id="submitBtn" disabled>
                📷 사진 선택 대기 중
            </button>
        </form>

        <div id="statusMsg" class="status-msg"></div>
    </div>

    <script>
        let selectedFiles = [];

        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const pinParam = urlParams.get('pin');
            if (pinParam) {
                document.getElementById("pinInput").value = pinParam;
            }

            document.getElementById("fileInput").addEventListener("change", handleFiles);
            document.getElementById("uploadForm").addEventListener("submit", handleSubmit);
        });

        function handleFiles(e) {
            selectedFiles = Array.from(e.target.files);
            const previewGrid = document.getElementById("previewGrid");
            previewGrid.innerHTML = "";

            if (selectedFiles.length > 0) {
                document.getElementById("submitBtn").disabled = false;
                document.getElementById("submitBtn").textContent = `📷 ${selectedFiles.length}장 사진 PC로 전송하기`;

                selectedFiles.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const div = document.createElement("div");
                        div.className = "preview-item";
                        div.innerHTML = `<img src="${evt.target.result}">`;
                        previewGrid.appendChild(div);
                    };
                    reader.readAsDataURL(file);
                });
            }
        }

        // 이미지 JPG 변환 및 초고속/고화질 압축 (1200px / 0.72 품질로 모바일 CORS 및 용량 차단 100% 방지)
        function convertToJpeg(file) {
            return new Promise((resolve) => {
                const img = new Image();
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        let w = img.width, h = img.height;
                        const maxDim = 1200;
                        if (w > maxDim || h > maxDim) {
                            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                            else { w = Math.round((w * maxDim) / h); h = maxDim; }
                        }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext("2d");
                        ctx.fillStyle = "#FFFFFF";
                        ctx.fillRect(0, 0, w, h);
                        ctx.drawImage(img, 0, 0, w, h);
                        
                        canvas.toBlob((blob) => {
                            if (!blob) { resolve(file); return; }
                            const baseName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                            const jpegFile = new File([blob], `${baseName}.jpg`, { type: "image/jpeg" });
                            resolve(jpegFile);
                        }, "image/jpeg", 0.72);
                    };
                    img.onerror = () => resolve(file);
                };
                reader.onerror = () => resolve(file);
            });
        }

        // File to Base64 helper
        function fileToBase64Data(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = () => resolve("");
            });
        }

        // ntfy.sh에 중계 메시지 전송 (Content-Type: text/plain으로 통신사 5G/LTE CORS OPTIONS 예비요청 블록 100% 우회)
        async function notifyViaNtfy(pin, photoInfo) {
            const topicPin = `photobridge_${pin}`;
            const topicGlobal = `photobridge_global_relay`;
            let success = false;
            let lastErrStr = "";

            const payloadStr = JSON.stringify(photoInfo);

            // 1. PIN 지정 채널 발신 (text/plain으로 CORS 프리플라이트 우회)
            try {
                const res = await fetch(`https://ntfy.sh/${topicPin}`, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain; charset=utf-8" },
                    body: payloadStr
                });
                if (res.ok) {
                    success = true;
                } else {
                    lastErrStr = `HTTP ${res.status}`;
                }
            } catch (err) {
                lastErrStr = err.message || "모바일 네트워크 통신 장애";
            }

            // 2. 글로벌 백업 채널 백그라운드 발신
            fetch(`https://ntfy.sh/${topicGlobal}`, {
                method: "POST",
                headers: { "Content-Type": "text/plain; charset=utf-8" },
                body: payloadStr
            }).then(r => { if (r.ok) success = true; }).catch(() => {});

            if (!success) {
                try {
                    const res2 = await fetch(`https://ntfy.sh/${topicGlobal}`, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain; charset=utf-8" },
                        body: payloadStr
                    });
                    if (res2.ok) success = true;
                } catch (e2) {}
            }

            if (!success) throw new Error(`PC 중계망 통신 오류 (${lastErrStr || "네트워크 상태 확인"})`);
        }

        async function handleSubmit(e) {
            e.preventDefault();
            if (selectedFiles.length === 0) return;

            const pin = document.getElementById("pinInput").value.trim();
            const submitBtn = document.getElementById("submitBtn");
            const statusMsg = document.getElementById("statusMsg");

            if (!pin || pin.length !== 6) {
                alert("6자리 핀코드를 정확히 입력하세요.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "⏳ GitHub Pages 웹 중계로 사진 전송 중...";

            try {
                let successCount = 0;
                for (let i = 0; i < selectedFiles.length; i++) {
                    submitBtn.textContent = `⏳ ${i+1}/${selectedFiles.length}장 압축 및 전송 중...`;
                    const jpegFile = await convertToJpeg(selectedFiles[i]);
                    const b64Data = await fileToBase64Data(jpegFile);
                    
                    const payload = {
                        pin: pin,
                        filename: jpegFile.name,
                        data: b64Data,
                        timestamp: Date.now()
                    };

                    await notifyViaNtfy(pin, payload);
                    successCount++;
                }

                statusMsg.className = "status-msg status-success";
                statusMsg.style.display = "block";
                statusMsg.innerHTML = `✅ <b>전송 성공!</b><br>${successCount}장의 사진이 PC로 전달되었습니다.<br>PC 화면에서 즉시 확인됩니다.`;
                
                if (navigator.vibrate) {
                    navigator.vibrate([100, 50, 100]);
                }

                selectedFiles = [];
                document.getElementById("previewGrid").innerHTML = "";
                submitBtn.textContent = "📷 새 사진 전송하기";
                submitBtn.disabled = true;
            } catch (err) {
                statusMsg.className = "status-msg status-error";
                statusMsg.style.display = "block";
                statusMsg.innerHTML = `❌ <b>전송 오류</b><br>${err.message}`;
                submitBtn.disabled = false;
                submitBtn.textContent = "🔄 다시 시도하기";
            }
        }
    </script>
</body>
</html>
